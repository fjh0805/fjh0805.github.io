---
layout: default
title: 写作
description: "登录后写笔记。"
permalink: /write/
---
<div class="page write-page">
    <header class="page-head">
        <h1>写作</h1>
        <p id="who" class="write-lead"></p>
    </header>

    <div class="write-actions" id="gate">
        <button type="button" id="login" hidden>用 GitHub 登录</button>
        <button type="button" id="logout" hidden>退出</button>
    </div>
    <div id="device" hidden>
        <p class="user-code" id="user-code"></p>
        <div class="write-actions device-actions">
            <button type="button" id="copy-code">复制验证码</button>
            <a class="button" id="verify-link" href="https://github.com/login/device" rel="noopener noreferrer">在 GitHub 输入验证码</a>
        </div>
    </div>
    <p id="status" class="status" role="status" aria-live="polite"></p>

    <div id="studio" hidden>
        <div class="write-actions">
            <button type="button" id="load-remote">读取已发布</button>
        </div>
        <ul id="remote-list" class="remote-list"></ul>

        <form id="editor">
            <label class="field">标题
                <input id="post-title" name="title" autocomplete="off" required>
            </label>
            <label class="field">副标题
                <input id="post-subtitle" name="subtitle" autocomplete="off">
            </label>
            <label class="field">日期
                <input id="post-date" name="date" type="date" required>
            </label>
            <label class="field">标签
                <input id="post-tags" name="tags" autocomplete="off" placeholder="用逗号分开">
            </label>
            <label class="field">英文文件名
                <input id="post-slug" name="slug" autocomplete="off" placeholder="escape-analysis" inputmode="url" autocapitalize="none" spellcheck="false">
            </label>
            <p id="slug-preview" class="help"></p>
            <label class="field">正文
                <textarea id="post-body" name="body" placeholder="用 Markdown 写。可以直接粘贴截图。"></textarea>
            </label>
            <div class="field">
                <span class="field-label">图片</span>
                <label class="pick" for="image-input">从相册选择</label>
                <input id="image-input" class="file-input" type="file" accept="image/png,image/jpeg,image/gif,image/webp" multiple>
                <p class="help">选中的图片会插进正文，并在下面预览。发布时才上传到仓库。</p>
            </div>
            <ul id="image-list" class="image-list"></ul>
        </form>

        <div class="write-actions publish-bar">
            <button type="button" id="new-draft">新草稿</button>
            <button type="button" id="preview-toggle">预览</button>
            <button type="button" id="download">下载 Markdown</button>
            <button type="button" id="publish" class="primary">发布</button>
        </div>

        <h2>本机草稿</h2>
        <ul id="draft-list" class="draft-list"></ul>
        <article id="preview" class="preview prose" hidden></article>
    </div>
</div>
<script type="module" src="{{ '/js/write.js' | relative_url }}"></script>
