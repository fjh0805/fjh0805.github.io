<li class="note">
    <a href="{{ include.post.url | relative_url }}">
        <time datetime="{{ include.post.date | date: '%Y-%m-%d' }}">{{ include.post.date | date: '%Y.%m.%d' }}</time>
        <span class="note-title">{{ include.post.title }}</span>
        {% if include.post.subtitle %}
        <span class="note-sub">{{ include.post.subtitle }}</span>
        {% endif %}
        {% if include.post.tags %}
        <span class="note-tags">{{ include.post.tags | join: ' · ' }}</span>
        {% endif %}
    </a>
</li>
