{% if site.gitalk.enable %}
<section class="comments" aria-label="评论">
    <h2>评论</h2>
    <link rel="stylesheet" href="https://unpkg.com/gitalk/dist/gitalk.css">
    <script src="https://unpkg.com/gitalk@latest/dist/gitalk.min.js"></script>
    {% unless include.fixed_id %}
    <script src="{{ '/js/md5.min.js' | relative_url }}"></script>
    {% endunless %}
    <div id="gitalk-container"></div>
    <script>
        var gitalk = new Gitalk({
            clientID: {{ site.gitalk.clientID | jsonify }},
            clientSecret: {{ site.gitalk.clientSecret | jsonify }},
            repo: {{ site.gitalk.repo | jsonify }},
            owner: {{ site.gitalk.owner | jsonify }},
            admin: [{{ site.gitalk.admin | jsonify }}],
            distractionFreeMode: {{ site.gitalk.distractionFreeMode }},
            id: {% if include.fixed_id %}{{ include.fixed_id | jsonify }}{% else %}md5(location.pathname){% endif %}
        });
        gitalk.render("gitalk-container");
    </script>
</section>
{% endif %}
