<header class="topbar">
    <div class="topbar-inner">
        <a class="brand" href="{{ '/' | relative_url }}">{{ site.title }}</a>
        <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="site-nav">菜单</button>
        <nav id="site-nav" aria-label="主导航">
            <ul class="nav-list">
                {% assign here = page.url | replace: 'index.html', '' %}
                {% for item in site.data.navigation %}
                <li>
                    <a href="{{ item.url | relative_url }}" {% if here == item.url %}aria-current="page"{% endif %}>{{ item.title }}</a>
                </li>
                {% endfor %}
            </ul>
        </nav>
    </div>
</header>
