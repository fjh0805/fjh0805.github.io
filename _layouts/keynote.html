---
layout: default
---
<div class="page">
    <article class="article">
        <header class="article-head">
            <h1 class="article-title">{{ page.title }}</h1>
            {% if page.subtitle %}<p class="dek">{{ page.subtitle }}</p>{% endif %}
        </header>
        {% if page.iframe %}
        <div class="embed">
            <iframe src="{{ page.iframe }}" title="{{ page.title | default: '嵌入内容' }}"></iframe>
        </div>
        {% endif %}
        <div class="prose">
            {{ content }}
        </div>
    </article>
</div>
